.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px}

</div>
<div id="mp"><label for="o">จุดเริ่มต้น</label><input id="o" placeholder="ชื่อสถานที่หรือที่อยู่"><label for="dt">จุดหมาย</label><input id="dt" placeholder="ชื่อสถานที่หรือที่อยู่"><p class="sub" style="margin:8px 0 0"><a id="gm" href="#" target="_blank" rel="noopener" style="color:var(--acc);font-weight:600">เปิดเส้นทางใน Google Maps</a></p><div class="sub" id="gmst" style="margin:6px 0 0">ระบุจุดเริ่มต้นและจุดหมาย ระบบจะดึงระยะทางมาใส่ให้อัตโนมัติ</div><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="rt2" style="width:auto"> ระยะที่กรอกเป็นเที่ยวเดียว คิดไป-กลับ (×2)</label></div>
<label for="m">ค่าที่ใช้คำนวณ</label>
<select id="m"><option value="a">ค่าเฉลี่ย</option><option value="s">เผื่อสูงสุด (ตามช่วงของคณะกรรมการ)</option></select>

<div class="res"><div class="big" id="r">0 ลิตร</div><div id="rf" class="fuel"></div><div id="rr" class="sub" style="margin:4px 0 0"></div></div>
<button class="go" id="sv">บันทึกรายการ</button>
</div>
<div class="card"><b>รายการของวันที่เลือก</b><div class="tw" id="dl"></div></div>
</section>

<section id="p2" class="hide">
<div class="card">
<div class="row">
<div><label for="pt">ช่วงเวลา</label><select id="pt"><option value="d">รายวัน</option><option value="m">รายเดือน</option><option value="y">รายปี</option></select></div>

</div>
</div>
<div class="card"><div class="sub" style="margin:0">น้ำมันที่ต้องเตรียม</div>
<div class="big dz" id="td">0 ลิตร</div><div class="fuel dz">ดีเซล</div>

</section>
</main>
